services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agnos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agnos_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-agnos}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # run once, in name order, when the data volume is empty
      - ./migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
      # dev only: points hospital-a at the mock-his service below
      - ./dev/mock_his.sql:/docker-entrypoint-initdb.d/900_mock_his.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agnos} -d ${POSTGRES_DB:-agnos}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal]

  app:
    build: .
    restart: unless-stopped
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-agnos}:${POSTGRES_PASSWORD:-agnos_dev_password}@db:5432/${POSTGRES_DB:-agnos}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string}
      TOKEN_TTL: ${TOKEN_TTL:-24h}
      HIS_TIMEOUT: ${HIS_TIMEOUT:-5s}
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]

  # Fake Hospital A HIS (cmd/mockhis). Internal only; the app reaches it at http://mock-his:8081.
  mock-his:
    build: .
    restart: unless-stopped
    entrypoint: ["mockhis"]
    environment:
      PORT: "8081"
    networks: [internal]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks: [internal]

# Only nginx publishes a port; the app and database are reachable inside the compose network only.
networks:
  internal:

volumes:
  pgdata:
