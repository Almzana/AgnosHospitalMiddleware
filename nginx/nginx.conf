# Reverse proxy in front of the Go service.

# Basic brute-force protection for the credential endpoints (per client IP).
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;

upstream app {
    server app:8080;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 1m;

    # Forward real client info to the service.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /staff/ {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://app;
    }

    location /patient/ {
        proxy_pass http://app;
    }

    # Swagger UI + OpenAPI spec for manual testing.
    location /swagger {
        proxy_pass http://app;
    }

    location = /health {
        proxy_pass http://app;
    }

    # Anything else is not part of the API.
    location / {
        return 404;
    }
}
